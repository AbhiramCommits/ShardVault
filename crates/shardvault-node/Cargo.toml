[package]
name = "shardvault-node"
version.workspace = true
edition.workspace = true

[dependencies]
shardvault-core = { path = "../shardvault-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"

[features]
fault-injection = ["shardvault-core/fault-injection"]

[lib]
name = "shardvault_node"
path = "src/lib.rs"

[[bin]]
name = "shardvault-node"
path = "src/main.rs"
